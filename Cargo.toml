[package]
name = "epbs-sim"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Discrete-event simulator for Ethereum enshrined proposer-builder separation (EIP-7732, Gloas)"
repository = "https://github.com/Naveen-6087/epbs-sim"
keywords = ["ethereum", "epbs", "eip-7732", "simulation", "consensus"]
categories = ["simulation", "cryptography::cryptocurrencies", "command-line-utilities"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.5"

[[bench]]
name = "sim"
harness = false

[profile.test]
opt-level = 2
